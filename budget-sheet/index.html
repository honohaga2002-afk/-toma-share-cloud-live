<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOMA SHARE 予算・決算</title><style>
:root{--g:#217346;--gs:#e2f0d9;--b:#d9eaf7;--y:#fff2cc;--r:#fce4d6;--line:#999;--head:#e7e6e6;--bg:#f3f3f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Aptos,Calibri,"Yu Gothic UI",sans-serif;color:#171717;font-size:16px}button,input,select{font:inherit}.top{background:var(--g);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.tools button,.tools select{min-height:40px;background:#fff;border:1px solid #bad8c7;padding:6px 11px}.guide{padding:8px 14px;background:#edf6fb;border-bottom:1px solid #aac7d7}.formula{display:grid;grid-template-columns:55px 30px 1fr;background:#fff;border-bottom:1px solid var(--line)}.formula span{padding:7px;border-right:1px solid #ccc}.fx{text-align:center;color:#666;font-style:italic}.area{overflow:auto;background:#fff;min-height:520px}.sheet{display:none;min-width:1180px}.sheet.on{display:block}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border:1px solid var(--line);height:38px;padding:0}.rn{width:42px;background:var(--head);text-align:center;color:#666;font-weight:400}.c1{width:155px}.c2{width:230px}.sm{width:105px}.money{width:130px}.letters th{background:var(--head);color:#666;font-weight:400}.title{text-align:center;font-size:20px;font-weight:600;letter-spacing:.18em;height:54px}.section{background:var(--y);padding:8px;font-weight:600}.red{background:var(--r)}.blue{background:var(--b)}.h{background:var(--head);padding:7px;text-align:center;font-weight:600}td input,td select{width:100%;height:100%;min-height:37px;border:0;border-radius:0;padding:7px 8px;background:#fff;font-size:16px}td input:focus,td select:focus{outline:2px solid var(--g);outline-offset:-2px}.num{text-align:right}.calc{background:var(--b);padding:8px;text-align:right}.total{background:var(--gs);padding:8px;text-align:right;font-weight:600}.note{padding:8px}.neg{color:#b42318}.pos{color:#146c39}.tabs{display:flex;gap:2px;overflow:auto;background:var(--head);padding:7px 9px 0;border-top:1px solid var(--line)}.tab{min-height:42px;white-space:nowrap;border:0;border-bottom:3px solid transparent;background:var(--head);padding:7px 14px}.tab.on{background:#fff;border-bottom-color:var(--g);font-weight:600}.status{background:var(--head);color:#666;padding:6px 10px;text-align:right}.toast{display:none;background:var(--y);padding:9px 14px;border-bottom:1px solid var(--line)}.toast.on{display:block}@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}.tools{width:100%}.tools button{flex:1}}@media print{.top,.guide,.formula,.tabs,.status,.toast{display:none!important}.area{overflow:visible}.sheet{min-width:0}.sheet:not(.on){display:none!important}@page{size:A4 landscape;margin:8mm}}
</style></head><body><header class="top"><strong>TOMA SHARE｜イベント収支管理</strong><div class="tools"><label>年度 <select id="year"></select></label><button id="save">保存</button><button id="print">印刷</button><button id="pdf">PDF化</button></div></header><div class="toast" id="toast"></div><div class="guide">実績は「取引明細」に入力すると、売上集計・経費集計・予実管理・決算書へ自動反映されます。</div><div class="formula"><span>A1</span><span class="fx">fx</span><span id="sheetName">基本情報</span></div><main class="area" id="area"></main><nav class="tabs" id="tabs"></nav><div class="status" id="status">準備完了</div><script src="app.js"></script></body></html>
