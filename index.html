<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0b76d1"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TOMA SHARE">

  <title>TOMA SHARE</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <header class="top">
    <div>
      <div class="brand">
        TOMA SHARE
      </div>

      <div class="meta">
        情報共有ワークスペース
      </div>
    </div>
  </header>


  <main>

    <section id="login">

      <div class="card">

        <h2>
          TOMA SHARE
        </h2>

        <div class="meta">
          名前を入力して共有スペースに入る
        </div>

        <input
          id="code"
          type="hidden"
          value="TOMA-2026"
          autocomplete="off"
        >

        <input
          id="memberName"
          placeholder="あなたの名前"
          autocomplete="name"
          enterkeyhint="go"
        >

        <button
          class="btn"
          id="enter"
          type="button"
        >
          ログイン
        </button>

        <div
          id="loginStatus"
          class="meta"
        >
          同じ共有コードの端末は同じデータを表示します。
        </div>

      </div>

    </section>


    <section
      id="home"
      class="hidden"
    ></section>

    <section
      id="drive"
      class="hidden"
    ></section>

    <section
      id="chat"
      class="hidden"
    ></section>

    <section
      id="cal"
      class="hidden"
    ></section>

    <section
      id="more"
      class="hidden"
    ></section>

  </main>


  <nav
    class="bottom hidden"
    id="nav"
  >

    <button
      class="nav on"
      data-p="home"
      type="button"
    >
      <span>🏠</span>
      ホーム
    </button>

    <button
      class="nav"
      data-p="drive"
      type="button"
    >
      <span>📁</span>
      ドライブ
    </button>

    <button
      class="nav"
      data-p="chat"
      type="button"
    >
      <span>💬</span>
      連絡
    </button>

    <button
      class="nav"
      data-p="cal"
      type="button"
    >
      <span>📅</span>
      予定
    </button>

    <button
      class="nav"
      data-p="more"
      type="button"
    >
      <span>≡</span>
      その他
    </button>

  </nav>


  <div
    id="toast"
    class="toast hidden"
  ></div>


  <script>
    try {
      localStorage.setItem(
        'tomaCode',
        'TOMA-2026'
      );
    } catch(e) {}
  </script>


  <!-- editor.jsはもう読み込まない -->
  <script src="/app.js?v=20260902-4"></script>

</body>
</html>
