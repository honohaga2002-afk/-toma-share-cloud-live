<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >
  <meta
    name="theme-color"
    content="#0b76d1"
  >

  <title>TOMA SHARE</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <header class="top">
    <div>
      <div class="brand">
        TOMA SHARE
      </div>

      <div class="meta">
        情報共有ワークスペース
      </div>
    </div>
  </header>


  <main>

    <!-- ================================
         ログイン
    ================================= -->

    <section id="login">

      <div class="card">

        <h2>
          TOMA SHARE
        </h2>

        <div class="meta">
          名前を入力して共有スペースに入る
        </div>


        <!--
          共有コードはTOMA-2026固定
          app.jsが必要とするためinput自体は残す
        -->

        <input
          id="code"
          type="hidden"
          value="TOMA-2026"
          autocomplete="off"
        >


        <input
          id="memberName"
          placeholder="あなたの名前"
          autocomplete="name"
        >


        <button
          class="btn"
          id="enter"
          type="button"
        >
          ログイン
        </button>


        <div
          id="loginStatus"
          class="meta"
        >
          同じ共有コードの端末は同じデータを表示します。
        </div>

      </div>

    </section>


    <!-- ================================
         ホーム
    ================================= -->

    <section
      id="home"
      class="hidden"
    ></section>


    <!-- ================================
         共有ドライブ
    ================================= -->

    <section
      id="drive"
      class="hidden"
    ></section>


    <!-- ================================
         連絡
    ================================= -->

    <section
      id="chat"
      class="hidden"
    ></section>


    <!-- ================================
         予定
    ================================= -->

    <section
      id="cal"
      class="hidden"
    ></section>


    <!-- ================================
         その他
    ================================= -->

    <section
      id="more"
      class="hidden"
    ></section>

  </main>


  <!-- ================================
       下部メニュー
  ================================= -->

  <nav
    class="bottom hidden"
    id="nav"
  >

    <button
      class="nav on"
      data-p="home"
      type="button"
    >
      <span>🏠</span>
      ホーム
    </button>


    <button
      class="nav"
      data-p="drive"
      type="button"
    >
      <span>📁</span>
      ドライブ
    </button>


    <button
      class="nav"
      data-p="chat"
      type="button"
    >
      <span>💬</span>
      連絡
    </button>


    <button
      class="nav"
      data-p="cal"
      type="button"
    >
      <span>📅</span>
      予定
    </button>


    <button
      class="nav"
      data-p="more"
      type="button"
    >
      <span>≡</span>
      その他
    </button>

  </nav>


  <!-- 通知 -->

  <div
    id="toast"
    class="toast hidden"
  ></div>


  <!-- ================================
       TOMA-2026を常に固定
  ================================= -->

  <script>
    (function () {
      const FIXED_CODE = 'TOMA-2026';

      try {
        localStorage.setItem(
          'tomaCode',
          FIXED_CODE
        );
      } catch (e) {
        console.error(e);
      }

      window.addEventListener(
        'DOMContentLoaded',
        function () {

          const code =
            document.getElementById(
              'code'
            );

          if (code) {
            code.value =
              FIXED_CODE;
          }

        }
      );
    })();
  </script>


  <!-- ================================
       TOMA SHARE本体
  ================================= -->

  <script src="/app.js"></script>


  <!-- ================================
       Excel / CSV編集
  ================================= -->

  <script src="/editor.js"></script>

</body>
</html>
