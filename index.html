<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b76d1">
  <title>TOMA SHARE</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>❄️ TOMA SHARE</h1>
  <div class="sub">予定・資料・連絡・議事録を同じクラウドで共有</div>
</header>
<main class="wrap">
  <section id="login">
    <div class="panel">
      <div class="title">共有ワークスペースに入る</div>
      <input id="code" placeholder="共有コード" value="TOMA-2026" autocomplete="off" autocapitalize="characters">
      <input id="memberName" placeholder="あなたの名前" autocomplete="name">
      <button class="btn" id="enter" type="button">ログイン</button>
      <div id="loginStatus" class="meta">同じ共有コードの端末は同じデータを表示します。</div>
    </div>
  </section>
  <section id="home" class="hidden"></section>
  <section id="drive" class="hidden"></section>
  <section id="chat" class="hidden"></section>
  <section id="cal" class="hidden"></section>
  <section id="more" class="hidden"></section>
</main>
<nav class="bottom hidden" id="nav">
  <button class="nav on" data-p="home"><span>🏠</span>ホーム</button>
  <button class="nav" data-p="drive"><span>📁</span>ドライブ</button>
  <button class="nav" data-p="chat"><span>💬</span>連絡</button>
  <button class="nav" data-p="cal"><span>📅</span>予定</button>
  <button class="nav" data-p="more"><span>☰</span>その他</button>
</nav>
<div id="toast" class="toast hidden"></div>
<script src="/app.js"></script>
</body>
</html>
