  <style>
    .syncStatus{font-size:12px;font-weight:800;color:rgba(255,255,255,.9);margin-top:3px;min-width:88px}.syncStatus[data-state="connected"],.syncStatus[data-state="saved"]{color:#c9f7d6}.syncStatus[data-state="saving"],.syncStatus[data-state="connecting"]{color:#fff0b3}.syncStatus[data-state="error"]{color:#ffd0d0}
    .fileItem{padding:16px 0}.fileInfo{width:100%;min-width:0;margin-bottom:12px}.fileInfo .title{font-size:17px;line-height:1.45;word-break:break-word}.fileInfo .meta{margin-top:4px}.fileActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}.fileActions .btn{width:100%;padding-left:8px;padding-right:8px;white-space:nowrap}.fileActions [data-edit]{display:none!important}.permitNotice{background:#f0f9ff;border-radius:10px;padding:10px;margin-bottom:6px}.officialPermitList{display:grid}.officialPermit{display:flex;align-items:center;gap:11px;padding:14px 2px;border-bottom:1px solid #e3edf2;color:#17364d;text-decoration:none}.officialPermit:last-child{border-bottom:0}.officialPermit:active{background:#f0f9ff}.officialPermitIcon{font-size:25px;flex:0 0 32px;text-align:center}.officialPermitBody{flex:1;min-width:0}.officialPermitBody .meta{margin-top:5px}.officialPermitBody .pill{margin-bottom:3px}.officialPermitArrow{font-size:30px;color:#78a2ba;line-height:1}
    @media(max-width:620px){body.ui-mobile{overflow-y:auto!important;-webkit-overflow-scrolling:touch!important}body.ui-mobile main{overflow:visible!important;min-height:100dvh!important;padding-top:14px!important;padding-bottom:calc(124px + env(safe-area-inset-bottom))!important}body.ui-mobile #chat{overflow:visible!important;max-height:none!important;min-height:calc(100dvh - 180px)!important;padding-top:2px!important;padding-bottom:24px!important}body.ui-mobile #chat .panel,body.ui-mobile #chat .item,body.ui-mobile #chat .recordItem{overflow:visible!important;max-height:none!important}body.ui-mobile #chat [data-message-delete]{position:relative!important;z-index:2!important;flex:0 0 auto!important;min-width:76px!important}body.ui-mobile #chat .recordItem{align-items:flex-start!important}}
    @media(max-width:520px){.officialPermit{padding:14px 0}.officialPermitBody .title{font-size:16px}.officialPermitBody .meta{font-size:12px}}
    @media(min-width:700px){.fileActions{grid-template-columns:repeat(4,minmax(120px,auto));justify-content:end}.officialPermitList{grid-template-columns:1fr 1fr;column-gap:20px}}
    #tomaSpreadsheetViewer{position:fixed;inset:0;z-index:10000;background:#fff;display:flex;flex-direction:column}.sheetViewerBar{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:#0b568f;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18)}.sheetViewerTitle{font-size:16px;font-weight:900;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sheetViewerActions{display:flex;gap:8px;flex:0 0 auto}.sheetViewerActions .btn{width:auto;margin:0;padding:9px 12px;font-size:14px}.sheetViewerFrame{position:relative;z-index:1;width:100%;flex:1;border:0;background:#fff}.sheetViewerLoading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 18px;border-radius:12px;background:#eef7fd;color:#17445f;font-weight:800;z-index:0}@media(max-width:520px){.sheetViewerBar{align-items:flex-start}.sheetViewerTitle{padding-top:9px}.sheetViewerActions [data-sheet-external]{display:none}}
    .folderCategory>summary::-webkit-details-marker{display:none}.folderCategory[open] .folderCategoryArrow{transform:rotate(180deg)}.folderCategoryArrow{display:inline-block;transition:transform .15s ease}.folderCategory>summary{touch-action:manipulation;-webkit-tap-highlight-color:rgba(11,118,209,.12)}
    .bottom a.nav{text-decoration:none;box-sizing:border-box;-webkit-tap-highlight-color:rgba(11,118,209,.14);touch-action:manipulation}
  </style>

<body>
  <script>
    (()=>{try{const mode=localStorage.getItem('tomaViewMode')||'auto';const resolved=mode==='desktop'||mode==='mobile'?mode:(window.innerWidth>=900?'desktop':'mobile');document.body.classList.add(resolved==='desktop'?'ui-desktop':'ui-mobile');document.body.dataset.viewMode=mode;}catch(e){document.body.classList.add(window.innerWidth>=900?'ui-desktop':'ui-mobile');}})();
  </script>
  <header class="top" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
    <div><div class="brand">TOMA SHARE</div><div class="meta">情報共有ワークスペース</div><div id="syncStatus" class="syncStatus" aria-live="polite">● 未接続</div></div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end">
      <label class="viewModeControl"><span>表示</span><select id="viewModeSelect" aria-label="表示モード"><option value="auto">自動</option><option value="desktop">PC</option><option value="mobile">モバイル</option></select></label>
      <label style="display:flex;align-items:center;gap:6px;color:#fff;font-weight:800;white-space:nowrap"><span>年度</span><select id="workspaceYear" aria-label="表示年度" style="width:auto;margin:0;padding:9px 28px 9px 10px;border:0;border-radius:10px;font-size:16px;font-weight:800"><option value="2026">2026年</option><option value="2027">2027年</option></select><button id="addWorkspaceYear" type="button" aria-label="年度を追加" style="border:0;border-radius:10px;background:#fff;color:#0b76d1;width:40px;height:40px;font-size:25px;font-weight:900;line-height:1">＋</button></label>
    </div>
  </header>
  <main>
    <section id="login"><div class="card"><h2>TOMA SHARE</h2><div class="meta">名前を入力して共有スペースに入る</div><input id="code" type="hidden" value="TOMA-2026" autocomplete="off"><input id="memberName" placeholder="あなたの名前" autocomplete="name" enterkeyhint="go"><button class="btn" id="enter" type="button">ログイン</button><div id="loginStatus" class="meta">同じ共有コードの端末は同じデータを表示します。</div></div></section>
    <section id="home" class="hidden"></section><section id="drive" class="hidden"></section><section id="chat" class="hidden"></section><section id="cal" class="hidden"></section><section id="more" class="hidden"></section><section id="minute" class="hidden"></section><section id="review" class="hidden"></section><section id="permit" class="hidden"></section><section id="events" class="hidden"></section><section id="tasks" class="hidden"></section><section id="search" class="hidden"></section><section id="trash" class="hidden"></section><section id="activity" class="hidden"></section>
  </main>
  <nav class="bottom hidden" id="nav">
    <a class="nav on" data-p="home" href="/?open=home"><span>🏠</span>ホーム</a>
    <a class="nav" data-p="drive" href="/?open=drive"><span>📁</span>ファイル共有</a>
    <a class="nav pcOnlyNav" data-p="events" href="/?open=events"><span>📅</span>イベント一覧</a>
