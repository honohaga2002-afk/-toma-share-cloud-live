<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <title>TOMA SHARE</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <!-- TOMA SHAREの描画先 -->
  <div id="app"></div>

  <!-- ファイル選択 -->
  <input
    id="fileInput"
    type="file"
    hidden
    multiple
    accept=".xlsx,.xls,.csv,.doc,.docx,.ppt,.pptx,.pdf,image/*,text/plain"
  >

  <!-- TOMA SHARE本体 -->
  <script src="/app.js"></script>

  <!-- Excel / CSV編集機能 -->
  <script src="/editor.js"></script>

  <!--
    共有コードを固定。
    初回でもTOMA-2026を使用する。
  -->
  <script>
    (function () {
      try {
        if (!localStorage.getItem('tomaCode')) {
          localStorage.setItem('tomaCode', 'TOMA-2026');
        }
      } catch (e) {
        console.error(e);
      }
    })();
  </script>

</body>
</html>
