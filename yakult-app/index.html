<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ヤクルト管理</title><style>
:root{--b:#1769e0;--bg:#eef5ff;--ln:#dce7f7;--tx:#173765}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#f7fbff,#edf4ff);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;color:var(--tx);max-width:480px;margin:auto;min-height:100vh}.app{padding:18px 16px 92px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{font-size:22px;margin:0;color:#123d87}.date{background:#fff;border:1px solid var(--ln);padding:9px 12px;border-radius:16px;font-weight:700}.card{background:#fff;border:1px solid var(--ln);border-radius:22px;padding:14px;box-shadow:0 8px 22px #1c65d716;margin-top:15px}.stats,.quick{display:grid;gap:10px}.stats{grid-template-columns:repeat(3,1fr)}.stat{text-align:center;background:#f7fbff;border:1px solid #e5eefc;border-radius:16px;padding:12px 6px}.stat b{font-size:21px;color:var(--b)}.quick{grid-template-columns:1fr 1fr;margin-top:15px}.tile{border:0;border-radius:20px;min-height:116px;color:#fff;font-weight:800;font-size:18px}.blue{background:linear-gradient(#5cacff,#287ff2)}.pink{background:linear-gradient(#ff9ab8,#f16f98)}.green{background:linear-gradient(#9adf91,#68bf78)}.purple{background:linear-gradient(#b29cff,#8b79ef)}.screen{display:none}.screen.active{display:block}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:grid;grid-template-columns:repeat(5,1fr);background:#fffffff2;border-top:1px solid var(--ln);padding:9px 8px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.nav button{border:0;background:none;color:#7186a9;padding:8px 2px;border-radius:14px;font-weight:800;font-size:11px}.nav button.active{background:#edf4ff;color:var(--b)}.nav i{display:block;font-style:normal;font-size:20px;margin-bottom:3px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:11px 0;border-top:1px solid #edf2fa}.row:first-child{border-top:0}.name{font-weight:800}.sub{font-size:12px;color:#7187a9;margin-top:3px}.badge{display:inline-block;background:#edf5ff;color:#2d67c6;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;margin-top:5px}.btn{border:0;border-radius:14px;padding:10px 12px;font-weight:800}.primary{background:linear-gradient(#348cff,#1769e0);color:#fff}.soft{background:#edf5ff;color:#2867c8}.danger{background:#ffedf1;color:#d8415e}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#6c84a8;margin-bottom:5px;font-weight:700}.field input,.field select{width:100%;padding:11px;border:1px solid #dbe6f6;border-radius:13px;font-size:15px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.calendar{background:#fff;border:1px solid var(--ln);border-radius:24px;padding:14px;box-shadow:0 8px 22px #1c65d716;margin-top:15px}.calhead{display:flex;justify-content:space-between;align-items:center}.calhead button{border:0;background:#eef5ff;color:#386db9;border-radius:12px;padding:8px 12px;font-size:20px}.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}.dow div{text-align:center;font-size:12px}.day{aspect-ratio:1;border:1px solid #e5edf9;background:white;border-radius:13px;font-weight:700;color:#2a4470}.day.today{background:linear-gradient(#53a8ff,#1f6be5);color:#fff}.sun{color:#e04c63!important}.sat{color:#2472ec!important}.product{display:flex;justify-content:space-between;align-items:center;background:#f8fbff;border:1px solid #e3ecfa;border-radius:16px;padding:12px;margin-top:8px}.modal{position:fixed;inset:0;background:#16315a66;display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:480px;margin:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}.tablewrap{overflow:auto;border:1px solid #dce6f5;border-radius:14px;margin-top:12px}table{border-collapse:collapse;width:max-content;min-width:100%;background:#fff}th,td{border:1px solid #dce6f5;padding:5px;font-size:11px;text-align:center;white-space:nowrap}th:first-child,td:first-child{position:sticky;left:0;background:#fff;min-width:105px;text-align:left}.company{font-size:11px;line-height:1.5;margin-top:10px}@page{size:176mm 125mm;margin:3mm}@media print{body{max-width:none;background:#fff}.top,.nav,.noprint,.screen:not(#receipt){display:none!important}#receipt{display:block!important}.app{padding:0}.card{box-shadow:none;border:0;margin:0;padding:0}.tablewrap{overflow:visible;border:0}table{width:100%}th,td{font-size:6.5px;padding:1.4px}th:first-child,td:first-child{position:static;min-width:auto}.company{font-size:7px}}
.tab-state{position:fixed;opacity:0;pointer-events:none;width:1px;height:1px}.screen{display:none!important}#tab-home:checked ~ .app #home,#tab-order:checked ~ .app #order,#tab-calendar:checked ~ .app #calendar,#tab-customers:checked ~ .app #customers,#tab-products:checked ~ .app #products,#tab-receipt:checked ~ .app #receipt{display:block!important}.nav label{border:0;background:none;color:#7186a9;padding:8px 2px;border-radius:14px;font-weight:800;font-size:11px;text-align:center;cursor:pointer}.nav label i{display:block;font-style:normal;font-size:20px;margin-bottom:3px}#tab-home:checked ~ .nav [for=tab-home],#tab-calendar:checked ~ .nav [for=tab-calendar],#tab-customers:checked ~ .nav [for=tab-customers],#tab-products:checked ~ .nav [for=tab-products],#tab-receipt:checked ~ .nav [for=tab-receipt]{background:#edf4ff;color:var(--b)}.tile{display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer}
</style></head><body>
<input class="tab-state" type="radio" name="main-tab" id="tab-home" checked><input class="tab-state" type="radio" name="main-tab" id="tab-order"><input class="tab-state" type="radio" name="main-tab" id="tab-calendar"><input class="tab-state" type="radio" name="main-tab" id="tab-customers"><input class="tab-state" type="radio" name="main-tab" id="tab-products"><input class="tab-state" type="radio" name="main-tab" id="tab-receipt">
<div class="app"><div class="top"><h1>ヤクルト管理</h1><div class="date" id="today"></div></div>
<section id="home" class="screen active"><div class="card"><b>今日の状況</b><div class="stats"><div class="stat">配達<br><b id="hCount">0</b>件</div><div class="stat">売上<br><b id="hSales">¥0</b></div><div class="stat">未配達<br><b id="hPending">0</b>件</div></div></div><div class="quick"><label class="tile blue" for="tab-order">📝<br>注文入力</label><label class="tile pink" for="tab-customers">👥<br>お客様</label><label class="tile green" for="tab-products">📦<br>商品・在庫</label><label class="tile purple" for="tab-receipt">🧾<br>明細・領収書</label></div><div class="card"><b>本日の配達予定</b><div id="todayList"></div></div></section>
<section id="calendar" class="screen"><div class="calendar"><div class="calhead"><button id="prev">‹</button><b id="calTitle"></b><button id="next">›</button></div><div class="dow"><div class="sun">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="sat">土</div></div><div class="days" id="days"></div></div><div class="card"><b id="scheduleTitle"></b><div id="schedule"></div><label class="btn primary noprint" id="orderForDay" for="tab-order" style="display:inline-block;cursor:pointer">この日に注文登録</label></div></section>
<section id="order" class="screen"><div class="card"><b>注文入力</b><div class="field"><label>配達日</label><input type="date" id="oDate"></div><div class="field"><label>グループ</label><select id="oGroup"></select></div><div class="field"><label>お客様</label><select id="oCustomer"></select></div><div class="field"><label>商品</label><select id="oProduct"></select></div><div class="field"><label>本数</label><input type="number" id="oQty" min="1" value="1"></div><button class="btn primary" id="saveOrder">この内容で登録</button></div></section>
<section id="customers" class="screen"><div class="card"><div class="grid2"><div class="field"><label>グループ</label><select id="groupFilter"></select></div><div class="field"><label>検索</label><input id="search" placeholder="名前・住所"></div></div><div style="display:flex;justify-content:space-between;align-items:center"><b>お客様一覧</b><button class="btn soft" id="addCustomer">＋新規</button></div><div id="customerList"></div></div></section>
<section id="products" class="screen"><div class="card"><div><b>商品リスト</b><div class="sub" style="margin-top:4px">商品マスタ：商品名・価格・税率を管理</div></div><form id="quickProductForm" style="margin-top:14px;padding:12px;border:1px solid #dfe9f8;border-radius:16px;background:#f8fbff"><div class="field"><label>商品名</label><input id="quickPName" placeholder="例：ヤクルト1000"></div><div class="grid2"><div class="field"><label>価格（税込）</label><input id="quickPPrice" type="number" min="0" inputmode="numeric" placeholder="130"></div><div class="field"><label>消費税率</label><select id="quickPTax"><option value="8">8%</option><option value="10">10%</option></select></div></div><div class="field"><label>初期在庫（任意）</label><input id="quickPStock" type="number" min="0" inputmode="numeric" placeholder="0"></div><button class="btn primary" type="submit" style="width:100%">商品を登録</button></form><div id="productList"></div></div><div class="card" style="margin-top:14px"><div><b>在庫リスト</b><div class="sub" style="margin-top:4px">在庫数だけを管理</div></div><div id="inventoryList"></div></div></section>
<section id="receipt" class="screen"><div class="card"><div class="noprint grid2"><div class="field"><label>お客様</label><select id="rCustomer"></select></div><div class="field"><label>月</label><select id="rMonth"></select></div></div><h2 id="rTitle" style="margin:8px 0;font-size:18px">お届け明細書兼領収書</h2><div id="rInfo" style="font-size:12px"></div><div class="tablewrap"><table id="rTable"></table></div><div class="company"><b>インボイス情報</b><br>8%対象税抜額：<span id="b8"></span>　消費税：<span id="t8"></span><br>10%対象税抜額：<span id="b10"></span>　消費税：<span id="t10"></span><br><br><b>苫小牧ヤクルト販売株式会社</b><br>静内営業所　TEL (0146)42-1064<br>登録番号 T6-4300-0105-3493</div><button class="btn primary noprint" style="margin-top:12px" onclick="window.print()">B6で印刷 / PDF保存</button></div></section></div>
<nav class="nav"><label for="tab-home"><i>⌂</i>ホーム</label><label for="tab-calendar"><i>🗓</i>カレンダー</label><label for="tab-customers"><i>👥</i>お客様</label><label for="tab-products"><i>📦</i>商品</label><label for="tab-receipt"><i>🧾</i>明細</label></nav>
<div class="modal" id="modal"><div class="sheet"><h3 id="mTitle"></h3><div id="mBody"></div><div style="display:flex;gap:8px"><button class="btn primary" id="mSave">保存</button><button class="btn soft" id="mClose">閉じる</button></div></div></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],pad=n=>String(n).padStart(2,'0'),yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');const now=new Date(),todayKey=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;const STORAGE_KEY='yakult-v6';const memoryStore={};const safeStorage={getItem(k){try{return window.localStorage.getItem(k)}catch(e){return memoryStore[k]??null}},setItem(k,v){try{window.localStorage.setItem(k,v)}catch(e){memoryStore[k]=String(v)}},removeItem(k){try{window.localStorage.removeItem(k)}catch(e){delete memoryStore[k]}}};const defaults={customers:[{id:'c1',name:'宮小牧 太郎',address:'苫小牧市○○町1-2-3',phone:'0144-12-3456',group:'Aグループ'},{id:'c2',name:'宮小牧 花子',address:'緑ヶ丘4-5-6',phone:'0144-23-4567',group:'Bグループ'}],products:[{id:'p1',name:'ヤクルト1000',price:130,stock:120,tax:8},{id:'p2',name:'ヤクルト400',price:100,stock:80,tax:8},{id:'p3',name:'ジョア',price:120,stock:50,tax:8}],orders:[]};let state;try{state=JSON.parse(safeStorage.getItem(STORAGE_KEY)||'null')}catch(e){state=null}if(!state||typeof state!=='object')state=JSON.parse(JSON.stringify(defaults));if(!Array.isArray(state.customers))state.customers=[];if(!Array.isArray(state.products))state.products=[];if(!Array.isArray(state.orders))state.orders=[];if(!state.products.length)state.products=JSON.parse(JSON.stringify(defaults.products));state.customers.forEach(c=>{if(c.group==null)c.group='';if(c.address==null)c.address='';if(c.phone==null)c.phone=''});state.products.forEach(p=>{if(!p.tax)p.tax=8;if(p.stock==null)p.stock=0;if(p.price==null)p.price=0});let cal=new Date(now.getFullYear(),now.getMonth(),1),selected=todayKey,mode='',editId='';const save=()=>safeStorage.setItem(STORAGE_KEY,JSON.stringify(state)),cust=id=>state.customers.find(x=>x.id===id),prod=id=>state.products.find(x=>x.id===id),groups=()=>[...new Set(state.customers.map(c=>c.group||'').filter(Boolean))].sort();function go(id){const r=document.getElementById('tab-'+id);if(r)r.checked=true;if(id==='calendar')renderCalendar();if(id==='customers')renderCustomers();if(id==='products'){renderProducts();renderInventory()}if(id==='receipt')renderReceipt();if(id==='order')fillOrder()}['home','order','calendar','customers','products','receipt'].forEach(id=>{const r=document.getElementById('tab-'+id);if(r)r.addEventListener('change',()=>{if(r.checked){if(id==='home')renderHome();if(id==='order')fillOrder();if(id==='calendar')renderCalendar();if(id==='customers')renderCustomers();if(id==='products'){renderProducts();renderInventory()}if(id==='receipt')renderReceipt();}})});function fmt(k){let d=new Date(k+'T00:00:00');return `${d.getMonth()+1}月${d.getDate()}日(${['日','月','火','水','木','金','土'][d.getDay()]})`}$('#today').textContent=fmt(todayKey);function renderHome(){let list=state.orders.filter(o=>o.date===todayKey),sales=list.reduce((a,o)=>a+(prod(o.productId)?.price||0)*o.qty,0);$('#hCount').textContent=list.length;$('#hSales').textContent=yen(sales);$('#hPending').textContent=list.filter(o=>!o.done).length;$('#todayList').innerHTML=list.length?list.map(o=>`<div class=row><div><div class=name>${cust(o.customerId)?.name||''} 様</div><div class=sub>${prod(o.productId)?.name||''} × ${o.qty}</div></div><button class="btn ${o.done?'soft':'primary'}" data-done="${o.id}">${o.done?'配達済':'未配達'}</button></div>`).join(''):'<div class=sub style="padding:10px 0">本日の注文はありません</div>';$$('[data-done]').forEach(b=>b.onclick=()=>{let o=state.orders.find(x=>x.id===b.dataset.done);o.done=!o.done;save();renderHome()})}function renderCalendar(){let y=cal.getFullYear(),m=cal.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();$('#calTitle').textContent=`${y}年 ${m+1}月`;let h='';for(let i=0;i<first;i++)h+='<div></div>';for(let d=1;d<=last;d++){let k=`${y}-${pad(m+1)}-${pad(d)}`,dw=new Date(k+'T00:00:00').getDay(),cl='day '+(dw===0?'sun ':'')+(dw===6?'sat ':'')+(k===todayKey?'today':'');h+=`<button class="${cl}" data-date="${k}">${d}</button>`}$('#days').innerHTML=h;$$('[data-date]').forEach(b=>b.onclick=()=>{selected=b.dataset.date;renderSchedule()});renderSchedule()}function renderSchedule(){let list=state.orders.filter(o=>o.date===selected);$('#scheduleTitle').textContent=fmt(selected)+' の予定';$('#schedule').innerHTML=list.length?list.map(o=>`<div class=row><div><div class=name>${cust(o.customerId)?.name||''} 様</div><div class=sub>${prod(o.productId)?.name||''} × ${o.qty}</div></div></div>`).join(''):'<div class=sub style="padding:10px 0">予定はありません</div>'}$('#prev').onclick=()=>{cal=new Date(cal.getFullYear(),cal.getMonth()-1,1);renderCalendar()};$('#next').onclick=()=>{cal=new Date(cal.getFullYear(),cal.getMonth()+1,1);renderCalendar()};function fillGroupSelect(sel,all=true){let a=groups(),v=sel.value;sel.innerHTML=(all?'<option value="">すべて</option>':'<option value="">未設定含む</option>')+a.map(g=>`<option>${g}</option>`).join('');if([...sel.options].some(o=>o.value===v))sel.value=v}function fillOrder(){fillGroupSelect($('#oGroup'));$('#oDate').value=$('#oDate').value||todayKey;filterCustomersForOrder();$('#oProduct').innerHTML=state.products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}function filterCustomersForOrder(){let g=$('#oGroup').value,list=state.customers.filter(c=>!g||c.group===g);$('#oCustomer').innerHTML=list.map(c=>`<option value="${c.id}">${c.name} 様${c.group?`（${c.group}）`:''}</option>`).join('')}$('#oGroup').onchange=filterCustomersForOrder;$('#saveOrder').onclick=()=>{let q=Number($('#oQty').value||0),p=prod($('#oProduct').value);if(!q||!p||!$('#oCustomer').value)return alert('お客様・商品・本数を確認してください');state.orders.push({id:'o'+Date.now(),date:$('#oDate').value,customerId:$('#oCustomer').value,productId:p.id,qty:q,done:false});p.stock=Math.max(0,p.stock-q);save();renderHome();renderInventory();selected=$('#oDate').value;go('calendar')};function openModal(title,body,m,id=''){mode=m;editId=id;$('#mTitle').textContent=title;$('#mBody').innerHTML=body;$('#modal').classList.add('show')}$('#mClose').onclick=()=>$('#modal').classList.remove('show');$('#addCustomer').onclick=()=>openModal('お客様登録','<div class=field><label>氏名</label><input id=mcName></div><div class=field><label>住所</label><input id=mcAddress></div><div class=field><label>電話</label><input id=mcPhone></div><div class=field><label>グループ</label><input id=mcGroup placeholder="例：Aグループ"></div>','addC');function renderCustomers(){fillGroupSelect($('#groupFilter'));let g=$('#groupFilter').value,q=$('#search').value||'',list=state.customers.filter(c=>(!g||c.group===g)&&(!q||[c.name,c.address,c.phone,c.group].join(' ').includes(q)));$('#customerList').innerHTML=list.map(c=>`<div class=row><div><div class=name>${c.name} 様</div><div class=sub>${c.address}<br>${c.phone||''}</div><span class=badge>${c.group||'未設定'}</span></div><div><button class="btn soft" data-ec="${c.id}">編集</button> <button class="btn danger" data-dc="${c.id}">削除</button></div></div>`).join('');$$('[data-ec]').forEach(b=>b.onclick=()=>{let c=cust(b.dataset.ec);openModal('お客様情報を編集',`<div class=field><label>氏名</label><input id=mcName value="${c.name}"></div><div class=field><label>住所</label><input id=mcAddress value="${c.address}"></div><div class=field><label>電話</label><input id=mcPhone value="${c.phone||''}"></div><div class=field><label>グループ</label><input id=mcGroup value="${c.group||''}"></div>`,'editC',c.id)});$$('[data-dc]').forEach(b=>b.onclick=()=>{if(state.orders.some(o=>o.customerId===b.dataset.dc))return alert('注文履歴があるため削除できません');if(confirm('削除しますか？')){state.customers=state.customers.filter(c=>c.id!==b.dataset.dc);save();renderCustomers();fillOrder()}})}$('#groupFilter').onchange=renderCustomers;$('#search').oninput=renderCustomers;function saveQuickProduct(){const nameEl=$('#quickPName'),priceEl=$('#quickPPrice'),taxEl=$('#quickPTax'),stockEl=$('#quickPStock');const name=nameEl.value.trim();if(!name){alert('商品名を入力してください');nameEl.focus();return}const price=Number(priceEl.value||0),stock=Number(stockEl.value||0),tax=Number(taxEl.value||8);state.products.push({id:'p'+Date.now(),name,price,stock,tax});save();nameEl.value='';priceEl.value='';stockEl.value='';taxEl.value='8';renderProducts();renderInventory();fillOrder();renderReceipt();alert('商品を追加しました')}$('#quickProductForm').addEventListener('submit',e=>{e.preventDefault();saveQuickProduct()});function renderProducts(){const el=$('#productList');el.innerHTML=state.products.length?state.products.map(p=>`<div class=product><div style="min-width:0"><div class=name>${p.name}</div><div class=sub>価格 ${Number(p.price||0).toLocaleString()}円 ・ 税率 ${p.tax||8}%</div></div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="btn soft" data-ep="${p.id}">編集</button><button class="btn danger" data-dp="${p.id}">削除</button></div></div>`).join(''):'<div class=sub style="padding:14px 0">商品がありません。上の入力欄から商品を登録してください。</div>';$$('[data-ep]').forEach(b=>b.onclick=()=>{let p=prod(b.dataset.ep);if(!p)return;openModal('商品を編集',`<div class=field><label>商品名</label><input id=mpName value="${String(p.name).replace(/"/g,'&quot;')}"></div><div class=grid2><div class=field><label>価格（税込）</label><input id=mpPrice type=number min=0 value="${p.price||0}"></div><div class=field><label>消費税率</label><select id=mpTax><option value=8 ${(p.tax||8)==8?'selected':''}>8%</option><option value=10 ${(p.tax||8)==10?'selected':''}>10%</option></select></div></div>`,'editP',p.id)});$$('[data-dp]').forEach(b=>b.onclick=()=>{let p=prod(b.dataset.dp);if(!p)return;if(state.orders.some(o=>o.productId===p.id)){alert('この商品には注文履歴があるため削除できません。商品名・価格・税率は編集できます。');return}if(confirm(`${p.name} を削除しますか？`)){state.products=state.products.filter(x=>x.id!==p.id);save();renderProducts();renderInventory();fillOrder();renderReceipt()}})}function renderInventory(){const el=$('#inventoryList');el.innerHTML=state.products.length?state.products.map(p=>`<div class=product><div style="min-width:0"><div class=name>${p.name}</div><div class=sub>現在庫 <b>${Number(p.stock||0).toLocaleString()}</b> 本</div></div><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end"><button class="btn soft" data-stock-minus="${p.id}">−1</button><button class="btn soft" data-stock-plus="${p.id}">＋1</button><button class="btn soft" data-stock-ten="${p.id}">＋10</button><input data-stock-input="${p.id}" type="number" min="0" inputmode="numeric" value="${p.stock||0}" style="width:82px;padding:9px;border:1px solid #dbe6f6;border-radius:12px"><button class="btn primary" data-stock-set="${p.id}">更新</button></div></div>`).join(''):'<div class=sub style="padding:14px 0">商品がありません。先に商品リストへ商品を登録してください。</div>';$$('[data-stock-minus]').forEach(b=>b.onclick=()=>{let p=prod(b.dataset.stockMinus);if(!p)return;p.stock=Math.max(0,Number(p.stock||0)-1);save();renderInventory()});$$('[data-stock-plus]').forEach(b=>b.onclick=()=>{let p=prod(b.dataset.stockPlus);if(!p)return;p.stock=Number(p.stock||0)+1;save();renderInventory()});$$('[data-stock-ten]').forEach(b=>b.onclick=()=>{let p=prod(b.dataset.stockTen);if(!p)return;p.stock=Number(p.stock||0)+10;save();renderInventory()});$$('[data-stock-set]').forEach(b=>b.onclick=()=>{let p=prod(b.dataset.stockSet),input=document.querySelector(`[data-stock-input="${b.dataset.stockSet}"]`);if(!p||!input)return;p.stock=Math.max(0,Number(input.value||0));save();renderInventory()})}$('#mSave').onclick=()=>{if(mode==='addC'){let n=$('#mcName').value.trim();if(!n)return alert('氏名を入力してください');state.customers.push({id:'c'+Date.now(),name:n,address:$('#mcAddress').value.trim(),phone:$('#mcPhone').value.trim(),group:$('#mcGroup').value.trim()})}if(mode==='editC'){let c=cust(editId),n=$('#mcName').value.trim();if(!n)return alert('氏名を入力してください');c.name=n;c.address=$('#mcAddress').value.trim();c.phone=$('#mcPhone').value.trim();c.group=$('#mcGroup').value.trim()}if(mode==='editP'){let p=prod(editId),n=$('#mpName').value.trim();if(!n)return alert('商品名を入力してください');p.name=n;p.price=Number($('#mpPrice').value||0);p.tax=Number($('#mpTax').value||8)}save();$('#modal').classList.remove('show');renderCustomers();renderProducts();renderInventory();fillOrder();renderReceipt()};function fillReceipt(){let oc=$('#rCustomer').value,om=$('#rMonth').value;$('#rCustomer').innerHTML=state.customers.map(c=>`<option value="${c.id}">${c.name} 様</option>`).join('');let ms=[...new Set(state.orders.map(o=>o.date.slice(0,7)).concat([todayKey.slice(0,7)]))].sort().reverse();$('#rMonth').innerHTML=ms.map(m=>`<option value="${m}">${m.replace('-','年')}月</option>`).join('');if(oc)$('#rCustomer').value=oc;if(om)$('#rMonth').value=om}function renderReceipt(){fillReceipt();let cid=$('#rCustomer').value,mk=$('#rMonth').value,c=cust(cid);if(!c||!mk)return;let [y,m]=mk.split('-').map(Number),days=new Date(y,m,0).getDate(),orders=state.orders.filter(o=>o.customerId===cid&&o.date.slice(0,7)===mk),pids=[...new Set(orders.map(o=>o.productId))],inc8=0,inc10=0;$('#rTitle').textContent=`${m}月分 お届け明細書兼領収書`;$('#rInfo').innerHTML=`住所　${c.address}<br>氏名　${c.name} 様`;let h='<thead><tr><th>商品名</th><th>単価</th>';for(let d=1;d<=days;d++)h+=`<th>${d}</th>`;h+='<th>計</th></tr></thead><tbody>';pids.forEach(id=>{let p=prod(id),rt=0;h+=`<tr><td>${p.name}</td><td>${p.price}</td>`;for(let d=1;d<=days;d++){let k=`${mk}-${pad(d)}`,q=orders.filter(o=>o.date===k&&o.productId===id).reduce((a,o)=>a+o.qty,0);rt+=q;let amt=q*p.price;if((p.tax||8)===10)inc10+=amt;else inc8+=amt;h+=`<td>${q||''}</td>`}h+=`<td>${rt}</td></tr>`});h+='</tbody>';$('#rTable').innerHTML=h;let b8=Math.round(inc8/1.08),b10=Math.round(inc10/1.10);$('#b8').textContent=yen(b8);$('#t8').textContent=yen(inc8-b8);$('#b10').textContent=yen(b10);$('#t10').textContent=yen(inc10-b10)}$('#rCustomer').onchange=renderReceipt;$('#rMonth').onchange=renderReceipt;renderHome();fillOrder();renderCalendar();renderCustomers();renderProducts();renderInventory();renderReceipt();
</script></body></html>
